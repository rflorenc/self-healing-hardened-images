# deployer.* and gitops.* are injected by the catalog

deployer:
  domain: ""
  apiUrl: ""

gitops:
  repoURL: ""
  revision: main
  path: "."

argocd:
  namespace: openshift-gitops
  project: default

# each component is a child Argo CD Application; enable it once it is built
components:
  bootstrap:
    enabled: true
    namespace: self-healing-demo
