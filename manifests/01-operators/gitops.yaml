# OpenShift GitOps without its default Argo CD instance
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-gitops-operator
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-gitops-operator
  namespace: openshift-gitops-operator
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-gitops-operator
  namespace: openshift-gitops-operator
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
spec:
  channel: gitops-1.22
  startingCSV: openshift-gitops-operator.v1.22.3   # the version this demo is validated on
  name: openshift-gitops-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual   # no surprise upgrades
  config:
    env:
      - name: DISABLE_DEFAULT_ARGOCD_INSTANCE
        value: "true"
