# Gitea operator from the RHDP catalog, demo tooling
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: redhat-rhpds-gitea
  namespace: openshift-marketplace
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
spec:
  sourceType: grpc
  image: quay.io/rhpds/gitea-catalog:v2.1.0
  displayName: Red Hat Demo Platform (Gitea)
  publisher: Red Hat Demo Platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitea-operator
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: gitea-operator
  namespace: gitea-operator
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: gitea-operator
  namespace: gitea-operator
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
spec:
  channel: stable
  startingCSV: gitea-operator.v2.1.0   # the version this demo is validated on
  name: gitea-operator
  source: redhat-rhpds-gitea
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual   # no surprise upgrades
