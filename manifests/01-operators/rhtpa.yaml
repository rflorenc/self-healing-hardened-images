# Trusted Profile Analyzer operator
apiVersion: v1
kind: Namespace
metadata:
  name: trusted-profile-analyzer
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: trusted-profile-analyzer
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
spec:
  targetNamespaces: [trusted-profile-analyzer]
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhtpa-operator
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
spec:
  channel: stable-v3
  startingCSV: rhtpa-operator.v3.1.1   # the version this demo is validated on
  name: rhtpa-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual   # no surprise upgrades
