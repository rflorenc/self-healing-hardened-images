# ACS operator
apiVersion: v1
kind: Namespace
metadata:
  name: rhacs-operator
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhacs-operator
  namespace: rhacs-operator
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhacs-operator
  namespace: rhacs-operator
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
spec:
  channel: rhacs-5.0
  startingCSV: rhacs-operator.v5.0.0   # the version this demo is validated on
  name: rhacs-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual   # no surprise upgrades
