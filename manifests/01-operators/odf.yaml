# OpenShift Data Foundation, used for NooBaa only
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-storage
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-storage
  namespace: openshift-storage
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
spec:
  targetNamespaces: [openshift-storage]
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: odf-operator
  namespace: openshift-storage
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
spec:
  channel: ${ODF_CHANNEL}   # stable-<OpenShift minor>, filled in by phases/01-operators.sh
  name: odf-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual   # no surprise upgrades
