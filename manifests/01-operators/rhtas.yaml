# Trusted Artifact Signer operator, cluster-wide: its only install mode
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhtas-operator
  namespace: openshift-operators
  labels:
    app.kubernetes.io/managed-by: cve-demo-setup
spec:
  channel: stable-v1.5
  startingCSV: rhtas-operator.v1.5.1   # the version this demo is validated on
  name: rhtas-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual   # no surprise upgrades
