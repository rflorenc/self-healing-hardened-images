# realm for Chains' signing identity; client secret from secret tas-chains-client
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: tas-chains
  namespace: ${KC_NS}
spec:
  keycloakCRName: keycloak
  placeholders:
    CHAINS_CLIENT_SECRET:
      secret: {name: tas-chains-client, key: client-secret}
  realm:
    realm: tas-chains
    enabled: true
    accessTokenLifespan: 900
    clients:
      - clientId: trusted-artifact-signer
        name: Tekton Chains (BO1122 demo pipeline signing)
        enabled: true
        publicClient: false
        secret: ${CHAINS_CLIENT_SECRET}
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        defaultClientScopes: [email, profile]
        protocolMappers:
          - name: audience-trusted-artifact-signer
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: trusted-artifact-signer
              access.token.claim: "true"
              id.token.claim: "true"
    users:
      - username: service-account-trusted-artifact-signer
        enabled: true
        serviceAccountClientId: trusted-artifact-signer
        email: chains@cve-demo.local
        emailVerified: true
