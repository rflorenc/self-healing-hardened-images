# realm for TPA: frontend for the UI, cli for the pipeline, sub mapped per client
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: tpa
  namespace: ${KC_NS}
spec:
  keycloakCRName: keycloak
  placeholders:
    TPA_CLI_SECRET:
      secret: {name: tpa-cli-client, key: client-secret}
    TPA_AUDITOR_PASSWORD:
      secret: {name: tpa-auditor, key: password}
  realm:
    realm: tpa
    enabled: true
    accessTokenLifespan: 900
    clientScopes:
      - {name: "read:document", protocol: openid-connect, attributes: {include.in.token.scope: "true", display.on.consent.screen: "false"}}
      - {name: "create:document", protocol: openid-connect, attributes: {include.in.token.scope: "true", display.on.consent.screen: "false"}}
      - {name: "update:document", protocol: openid-connect, attributes: {include.in.token.scope: "true", display.on.consent.screen: "false"}}
      - {name: "delete:document", protocol: openid-connect, attributes: {include.in.token.scope: "true", display.on.consent.screen: "false"}}
    clients:
      - clientId: frontend
        name: Trusted Profile Analyzer UI
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris: ["https://${TPA_HOST}/*"]
        webOrigins: ["https://${TPA_HOST}"]
        attributes: {pkce.code.challenge.method: S256, post.logout.redirect.uris: "https://${TPA_HOST}/*"}
        defaultClientScopes: ["read:document", "create:document", "update:document", "delete:document"]
        protocolMappers:
          - {name: audience, protocol: openid-connect, protocolMapper: oidc-audience-mapper,
             config: {included.client.audience: frontend, access.token.claim: "true", id.token.claim: "true"}}
          - {name: subject, protocol: openid-connect, protocolMapper: oidc-sub-mapper,
             config: {access.token.claim: "true", introspection.token.claim: "true"}}
          - {name: username, protocol: openid-connect, protocolMapper: oidc-usermodel-property-mapper,
             config: {user.attribute: username, claim.name: preferred_username, jsonType.label: String,
                      access.token.claim: "true", id.token.claim: "true", userinfo.token.claim: "true"}}
      - clientId: cli
        name: Trusted Profile Analyzer API (BO1122 pipeline SBOM upload)
        enabled: true
        publicClient: false
        secret: ${TPA_CLI_SECRET}
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        defaultClientScopes: ["read:document", "create:document", "update:document"]
        protocolMappers:
          - {name: audience, protocol: openid-connect, protocolMapper: oidc-audience-mapper,
             config: {included.client.audience: cli, access.token.claim: "true", id.token.claim: "true"}}
          - {name: subject, protocol: openid-connect, protocolMapper: oidc-sub-mapper,
             config: {access.token.claim: "true", introspection.token.claim: "true"}}
    users:
      - username: auditor
        enabled: true
        email: auditor@cve-demo.local
        emailVerified: true
        firstName: Demo
        lastName: Auditor
        credentials: [{type: password, value: "${TPA_AUDITOR_PASSWORD}", temporary: false}]
      - username: service-account-cli
        enabled: true
        serviceAccountClientId: cli
